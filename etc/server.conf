# TLS server certificate request
# The SAN list comes from the SAN environment variable, e.g.
#   SAN="DNS:localhost,IP:127.0.0.1" openssl req -new -config etc/server.conf ...

[ default ]
SAN                     = DNS:localhost         # Default value

[ req ]
default_bits            = 2048                  # RSA key size
encrypt_key             = no                    # Tomcat needs to read the key at startup
default_md              = sha256                # MD to use
utf8                    = yes                   # Input is UTF-8
string_mask             = utf8only              # Emit UTF-8 strings
prompt                  = yes                   # Prompt for DN (overridden with -subj)
distinguished_name      = server_dn             # DN template
req_extensions          = server_reqext         # Desired extensions

[ server_dn ]
0.domainComponent       = "1. Domain Component         (eg, org)     "
1.domainComponent       = "2. Domain Component         (eg, simple)  "
organizationName        = "3. Organization Name        (eg, company) "
organizationalUnitName  = "4. Organizational Unit Name (eg, section) "
commonName              = "5. Common Name              (eg, FQDN)    "
commonName_max          = 64

[ server_reqext ]
keyUsage                = critical,digitalSignature,keyEncipherment
extendedKeyUsage        = serverAuth,clientAuth
subjectKeyIdentifier    = hash
subjectAltName          = $ENV::SAN
